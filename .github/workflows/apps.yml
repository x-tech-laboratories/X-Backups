name: Apps

# Builds the desktop and Android apps, the portals onto an X-Backups server, and keeps them as the run's artifacts.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # electron-builder's Flatpak target installs the Freedesktop runtime and the Electron base app from Flathub.
      - name: Install the Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - run: npm ci
      - name: Build the AppImage and the Flatpak bundle
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist-desktop/*.AppImage
            dist-desktop/*.flatpak

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build the APK
        run: |
          npm run build:android
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/app/build/outputs/apk/debug/app-debug.apk
